<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Робот-сортировщик: рука робота раскладывает цветные кубики по конвейеру">
  <rect width="800" height="450" fill="#e9eefc"/>
  <!-- стена и пол -->
  <rect x="0" y="330" width="800" height="120" fill="#d7defa"/>
  <!-- конвейер -->
  <rect x="80" y="300" width="640" height="34" rx="17" fill="#0a1028"/>
  <g fill="#2a3360">
    <circle cx="120" cy="317" r="10"/><circle cx="220" cy="317" r="10"/><circle cx="320" cy="317" r="10"/>
    <circle cx="420" cy="317" r="10"/><circle cx="520" cy="317" r="10"/><circle cx="620" cy="317" r="10"/><circle cx="680" cy="317" r="10"/>
  </g>
  <rect x="110" y="334" width="24" height="40" fill="#0a1028"/>
  <rect x="666" y="334" width="24" height="40" fill="#0a1028"/>
  <!-- кубики на ленте -->
  <g stroke="#0a1028" stroke-width="4" stroke-linejoin="round">
    <rect x="150" y="244" width="56" height="56" rx="8" fill="#c7e85a"/>
    <rect x="260" y="244" width="56" height="56" rx="8" fill="#246fff"/>
    <rect x="560" y="244" width="56" height="56" rx="8" fill="#f59e0b"/>
  </g>
  <!-- стойка робота -->
  <rect x="380" y="90" width="40" height="214" rx="12" fill="#5b6cff"/>
  <rect x="340" y="70" width="120" height="44" rx="22" fill="#246fff"/>
  <!-- рука -->
  <g fill="none" stroke="#246fff" stroke-width="22" stroke-linecap="round" stroke-linejoin="round">
    <path d="M400 92 L520 140 L470 220"/>
  </g>
  <circle cx="520" cy="140" r="18" fill="#0a1028"/>
  <circle cx="400" cy="92" r="18" fill="#0a1028"/>
  <!-- захват с кубиком -->
  <g stroke="#0a1028" stroke-width="4" stroke-linejoin="round">
    <path d="M444 222 h52 v24 h-52z" fill="#5b6cff"/>
    <path d="M440 246 v30 h14 v-30z M486 246 v30 h14 v-30z" fill="#0a1028"/>
    <rect x="446" y="262" width="48" height="48" rx="8" fill="#c7e85a"/>
  </g>
  <!-- глаза робота -->
  <g fill="#ffffff">
    <circle cx="378" cy="92" r="8"/><circle cx="422" cy="92" r="8"/>
  </g>
  <g fill="#0a1028">
    <circle cx="380" cy="93" r="4"/><circle cx="424" cy="93" r="4"/>
  </g>
  <!-- корзины -->
  <g stroke="#0a1028" stroke-width="4" stroke-linejoin="round">
    <path d="M60 390 l10 50 h70 l10 -50z" fill="#c7e85a"/>
    <path d="M300 390 l10 50 h70 l10 -50z" fill="#246fff"/>
    <path d="M640 390 l10 50 h70 l10 -50z" fill="#f59e0b"/>
  </g>
</svg>
