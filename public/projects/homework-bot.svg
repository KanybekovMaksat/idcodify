<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Бот-помощник по домашке: окно чата с ботом и учебником">
  <rect width="800" height="450" fill="#f2f8e4"/>
  <!-- окно чата -->
  <rect x="150" y="40" width="500" height="370" rx="28" fill="#ffffff" stroke="#0a1028" stroke-width="4"/>
  <rect x="150" y="40" width="500" height="64" rx="28" fill="#246fff"/>
  <rect x="150" y="80" width="500" height="24" fill="#246fff"/>
  <!-- аватар бота в шапке -->
  <circle cx="196" cy="72" r="20" fill="#c7e85a"/>
  <circle cx="190" cy="72" r="4" fill="#0a1028"/><circle cx="202" cy="72" r="4" fill="#0a1028"/>
  <path d="M196 52 v-10" stroke="#0a1028" stroke-width="4" stroke-linecap="round"/>
  <circle cx="196" cy="40" r="5" fill="#0a1028"/>
  <rect x="230" y="62" width="150" height="20" rx="10" fill="#ffffff"/>
  <circle cx="610" cy="72" r="8" fill="#c7e85a"/>
  <!-- сообщение бота -->
  <path d="M190 140 h250 a14 14 0 0 1 14 14 v50 a14 14 0 0 1 -14 14 h-250 l-16 16 v-80 a14 14 0 0 1 16 -14z" fill="#e9eefc"/>
  <rect x="206" y="156" width="200" height="12" rx="6" fill="#0a1028"/>
  <rect x="206" y="180" width="150" height="12" rx="6" fill="#0a1028" opacity="0.5"/>
  <!-- сообщение ученика -->
  <path d="M610 250 h-250 a14 14 0 0 0 -14 14 v34 a14 14 0 0 0 14 14 h250 l16 16 v-64 a14 14 0 0 0 -16 -14z" fill="#246fff"/>
  <rect x="366" y="268" width="210" height="12" rx="6" fill="#ffffff"/>
  <!-- бот печатает -->
  <path d="M190 330 h110 a14 14 0 0 1 14 14 v20 a14 14 0 0 1 -14 14 h-110 l-16 16 v-50 a14 14 0 0 1 16 -14z" fill="#e9eefc"/>
  <g fill="#246fff">
    <circle cx="214" cy="354" r="6"/><circle cx="240" cy="354" r="6"/><circle cx="266" cy="354" r="6"/>
  </g>
  <!-- учебник -->
  <g transform="translate(560 300) rotate(-8)">
    <rect x="0" y="0" width="150" height="110" rx="10" fill="#f59e0b" stroke="#0a1028" stroke-width="4"/>
    <rect x="0" y="0" width="22" height="110" rx="10" fill="#0a1028"/>
    <rect x="40" y="24" width="86" height="10" rx="5" fill="#ffffff"/>
    <rect x="40" y="46" width="60" height="10" rx="5" fill="#ffffff"/>
    <circle cx="112" cy="80" r="14" fill="#c7e85a" stroke="#0a1028" stroke-width="4"/>
  </g>
</svg>
